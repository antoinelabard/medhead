name: medhead

services:
  # Génère une fois le certificat TLS de développement dans le volume edge-certs (jamais versionné).
  # Image déjà épinglée pour recommendation-service et livrée avec openssl : ni réseau ni paquet installé à l'exécution.
  edge-cert:
    image: eclipse-temurin:25.0.5.1_2-jre-noble
    profiles: [app]
    user: "0:0"
    command: ["sh", "/generate-dev-cert.sh", "/certs"]
    volumes:
      - ./infra/edge/generate-dev-cert.sh:/generate-dev-cert.sh:ro
      - edge-certs:/certs
    network_mode: none
    restart: "no"

  edge:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    profiles: [app]
    ports:
      - "${MEDHEAD_EDGE_PORT:-443}:8443"
    volumes:
      - ./infra/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - edge-certs:/etc/nginx/certs:ro
    networks: [edge, backend]
    depends_on:
      edge-cert:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  frontend:
    image: medhead/frontend:${MEDHEAD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: [app]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  recommendation-service:
    image: medhead/recommendation-service:${MEDHEAD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    profiles: [app]
    networks: [backend]
    environment:
      MEDHEAD_RECOMMENDATION_SERVICE_SPECIALTIES_FILE: ${MEDHEAD_RECOMMENDATION_SERVICE_SPECIALTIES_FILE:-file:/app/reference/specialties.json}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped

networks:
  edge: {}
  # Interne : aucune sortie hors de Docker ; seul edge fait le pont avec l'hôte.
  backend:
    internal: true

volumes:
  edge-certs: {}
