# Sert uniquement les fichiers statiques de l'application Angular, en HTTP sur 8080 (TLS terminé par edge).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
