openapi: 3.1.0
info:
  title: MedHead API
  description: Contrat REST de la plateforme MedHead, source de vérité du code serveur et du client Angular.
  version: 1.0.0
servers:
  - url: /
tags:
  - name: specialties
    description: Référentiel des spécialités NHS
paths:
  /api/v1/specialties:
    get:
      tags: [specialties]
      operationId: listSpecialties
      summary: Liste les spécialités NHS
      description: Renvoie toutes les spécialités du référentiel, dans l'ordre du référentiel.
      responses:
        '200':
          description: Liste des spécialités
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Specialty'
        default:
          description: Erreur au format RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    Specialty:
      type: object
      required: [code, group, label]
      properties:
        code:
          type: string
          description: Code stable en kebab-case anglais
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          example: emergency-medicine
        group:
          type: string
          description: Groupe de spécialité
          example: Médecine d'urgence
        label:
          type: string
          description: Libellé de la spécialité
          example: Médecine d'urgence
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type:
          type: string
          format: uri-reference
          example: 'urn:medhead:problem:unknown-specialty'
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
