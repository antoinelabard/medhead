# Point d'entrée unique de la PoC : TLS sur 8443 (publié en 443 sur l'hôte).
# Routes : / -> frontend, /api/ -> recommendation-service, sans réécriture de chemin. Rien d'autre.

# Résolution dynamique par le DNS de Docker : un service redémarré ou arrêté est pris en compte.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    # Actuator n'est jamais exposé (il écoute sur 8081, non routé) : refus explicite
    # pour que le repli de l'application monopage ne réponde pas à sa place.
    location ^~ /actuator {
        return 404;
    }

    location /api/ {
        set $recommendation_service recommendation-service:8080;
        proxy_pass http://$recommendation_service;
    }

    location / {
        set $frontend frontend:8080;
        proxy_pass http://$frontend;
    }
}

# Sonde de santé locale au conteneur, non publiée.
server {
    listen 127.0.0.1:8081;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
